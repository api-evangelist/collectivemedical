description: 'Collective Medical was a Salt Lake City-based healthtech company that operated a
  real-time care-collaboration network connecting hospitals, emergency departments, health plans, and
  provider organizations to identify and coordinate care for high-risk and complex patients. It is best
  known for its EDIE (Emergency Department Information Exchange) and PreManage platforms. Collective Medical
  was acquired by PointClickCare in 2020, and the brand now operates as a product line within PointClickCare;
  collectivemedical.com resolves to a PointClickCare marketing page. This profile has no public API,
  developer portal, or machine-readable specification surface.'
